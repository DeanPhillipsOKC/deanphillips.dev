# Builds every pull request (a green check that means "the site builds") and deploys main to the
# Cloudflare Worker that serves deanphillips.dev. This replaces Cloudflare's own Git integration,
# whose builds of non-production branches failed and left a red X on every PR.
#
# The repo is public, so these Actions minutes are free.
#
# Deploy needs two repo secrets: CLOUDFLARE_API_TOKEN (a token from the "Edit Cloudflare Workers"
# template) and CLOUDFLARE_ACCOUNT_ID. Without the token, the deploy step prints a notice and
# skips, so main never goes red while it's being set up.
name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN isn't set; skipping deploy."
            exit 0
          fi
          # wrangler.jsonc runs `npm run build` again first; it takes a few seconds.
          npx --yes wrangler@4 deploy
