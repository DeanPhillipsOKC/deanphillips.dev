<!doctype html>
<!--
  The animated scene for the OWASP LLM01 explainer video (see owasp-llm01.mjs). Everything is
  drawn from one function, draw(t), so the renderer can step through time exactly and take a
  screenshot per frame. The art is hand-drawn SVG line glyphs (no outside art to license).
  setup(timeline) is called first with { lines: [{ s, e, caption }], total }.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --bg: #0e1116; --card: #171d27; --line: #253041; --text: #eef2f7; --muted: #9aa6b6; --teal: #4fd1c5; --violet: #a78bfa; --pink: #f2879c; --ok: #3ddc97; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; }
  .glow { position: absolute; inset: 0; background:
    radial-gradient(520px 360px at 8% 0%, rgba(79, 209, 197, .20), transparent 70%),
    radial-gradient(560px 380px at 100% 0%, rgba(167, 139, 250, .20), transparent 70%); }
  svg { position: absolute; inset: 0; width: 1280px; height: 720px; }
  .tag { position: absolute; left: 48px; top: 36px; display: flex; align-items: center; gap: 12px; font: 700 22px 'Space Grotesk', sans-serif; }
  .tag b { color: var(--teal); letter-spacing: .12em; font-size: 17px; padding: 6px 12px; border: 1px solid var(--teal); border-radius: 999px; }
  .site { position: absolute; right: 48px; top: 42px; font: 500 18px Inter, sans-serif; color: var(--muted); }
  .cap { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; padding: 0 120px; font: 500 32px/1.3 Inter, sans-serif; text-shadow: 0 2px 12px #0e1116, 0 0 3px #0e1116; }
  .bar { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: linear-gradient(100deg, var(--teal), var(--violet)); }
  text { font-family: Inter, sans-serif; }
  .h { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="tag"><b>LLM01</b><span>Prompt injection</span></div>
<div class="site">deanphillips.dev</div>

<svg viewBox="0 0 1280 720" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Scene A: text streams into the model -->
  <g id="sceneA">
    <!-- source glyphs (64x64 boxes, drawn at 1.15x) -->
    <g id="srcDoc" transform="translate(96 150) scale(1.15)" stroke="#4fd1c5" stroke-width="3.2">
      <path pathLength="1" d="M10 6h30l14 14v38H10z M40 6v14h14 M18 32h28 M18 42h28 M18 52h18"/>
    </g>
    <g id="srcMail" transform="translate(96 320) scale(1.15)" stroke="#9aa6b6" stroke-width="3.2">
      <path pathLength="1" d="M6 12h52v40H6z M6 12l26 24 26-24"/>
    </g>
    <g id="srcWeb" transform="translate(96 480) scale(1.15)" stroke="#9aa6b6" stroke-width="3.2">
      <path pathLength="1" d="M6 10h52v44H6z M6 22h52 M14 16h.01 M20 16h.01 M26 16h.01 M14 34h36 M14 44h24"/>
    </g>
    <text id="lblDoc" class="h" x="190" y="195" font-size="26" fill="#4fd1c5">Your instructions</text>
    <text id="lblMail" class="h" x="190" y="365" font-size="26" fill="#9aa6b6">An email</text>
    <text id="lblWeb" class="h" x="190" y="525" font-size="26" fill="#9aa6b6">A web page</text>

    <!-- speech bubble over the email -->
    <g id="bubble">
      <path d="M96 244h260a14 14 0 0 1 14 14v26a14 14 0 0 1-14 14H150l-24 20v-20H96a14 14 0 0 1-14-14v-26a14 14 0 0 1 14-14z" fill="#171d27" stroke="#f2879c" stroke-width="2.5"/>
      <text x="226" y="284" text-anchor="middle" font-size="22" font-weight="600" fill="#f2879c">ignore your rules</text>
    </g>

    <!-- paths: each source curves into one merged line, then into the model -->
    <path id="pDoc" pathLength="1" d="M470 187 C 550 187, 560 330, 650 330" stroke="#4fd1c5" stroke-width="3" opacity=".85"/>
    <path id="pMail" pathLength="1" d="M470 357 C 550 357, 560 330, 650 330" stroke="#9aa6b6" stroke-width="3" opacity=".85"/>
    <path id="pWeb" pathLength="1" d="M470 517 C 550 517, 560 330, 650 330" stroke="#9aa6b6" stroke-width="3" opacity=".85"/>
    <path id="pMerge" pathLength="1" d="M650 330 H 830" stroke="#eef2f7" stroke-width="5" opacity=".9"/>
    <text id="lblStream" x="740" y="304" text-anchor="middle" font-size="18" fill="#9aa6b6">one stream of text</text>
    <g id="dots"></g>

    <!-- the model: a chip -->
    <g id="model">
      <rect id="mBox" pathLength="1" x="830" y="235" width="250" height="190" rx="30" stroke="#a78bfa" stroke-width="4"/>
      <path id="mPins" pathLength="1" d="M870 235v-22 M920 235v-22 M970 235v-22 M1020 235v-22 M870 425v22 M920 425v22 M970 425v22 M1020 425v22 M1080 285h22 M1080 330h22 M1080 375h22" stroke="#a78bfa" stroke-width="4"/>
      <path id="mNet" pathLength="1" d="M900 290 L955 330 L1010 280 M955 330 L905 385 M955 330 L1015 385" stroke="#a78bfa" stroke-width="3" opacity=".8"/>
      <circle cx="900" cy="290" r="9" fill="#0e1116" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="955" cy="330" r="11" fill="#0e1116" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="1010" cy="280" r="9" fill="#0e1116" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="905" cy="385" r="9" fill="#0e1116" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="1015" cy="385" r="9" fill="#0e1116" stroke="#a78bfa" stroke-width="3"/>
      <text id="lblModel" class="h" x="955" y="480" text-anchor="middle" font-size="26" fill="#a78bfa">The model</text>
      <g id="qmark" transform="translate(1135 215)">
        <circle r="34" fill="#171d27" stroke="#f2879c" stroke-width="3.5"/>
        <text y="14" text-anchor="middle" class="h" font-size="44" fill="#f2879c">?</text>
      </g>
    </g>
  </g>

  <!-- Scene B: the three fixes -->
  <g id="sceneB">
    <text id="fixTitle" class="h" x="640" y="170" text-anchor="middle" font-size="46" fill="#eef2f7">The fix isn't a better prompt</text>
    <g id="oldFix">
      <rect id="oldBox" x="330" y="290" width="620" height="110" rx="24" fill="#171d27" stroke="#253041" stroke-width="2.5"/>
      <text x="640" y="355" text-anchor="middle" font-size="30" font-weight="500" fill="#9aa6b6">"Never obey instructions in emails."</text>
      <path id="strike" pathLength="1" d="M360 345 H 920" stroke="#f2879c" stroke-width="5"/>
    </g>
    <g id="card1" transform="translate(150 230)">
      <rect width="300" height="270" rx="24" fill="#171d27" stroke="#253041" stroke-width="2"/>
      <g transform="translate(86 34) scale(2.1)" stroke="#4fd1c5" stroke-width="2.6"><path pathLength="1" id="g1" d="M20 32a9 9 0 1 0 .01 0 M29 32h29 M47 32v10 M55 32v8"/></g>
      <text x="150" y="206" text-anchor="middle" class="h" font-size="30" fill="#eef2f7">Less power</text>
      <text x="150" y="238" text-anchor="middle" font-size="20" fill="#9aa6b6">Only the tools it needs</text>
    </g>
    <g id="card2" transform="translate(490 230)">
      <rect width="300" height="270" rx="24" fill="#171d27" stroke="#253041" stroke-width="2"/>
      <g transform="translate(86 34) scale(2.1)" stroke="#a78bfa" stroke-width="2.6"><path pathLength="1" id="g2" d="M32 6l22 8v16c0 14-9 24-22 28C19 54 10 44 10 30V14z M21 32l8 8 14-16"/></g>
      <text x="150" y="206" text-anchor="middle" class="h" font-size="30" fill="#eef2f7">Checks in code</text>
      <text x="150" y="238" text-anchor="middle" font-size="20" fill="#9aa6b6">A prompt is a request</text>
    </g>
    <g id="card3" transform="translate(830 230)">
      <rect width="300" height="270" rx="24" fill="#171d27" stroke="#253041" stroke-width="2"/>
      <g transform="translate(86 34) scale(2.1)" stroke="#3ddc97" stroke-width="2.6"><path pathLength="1" id="g3" d="M26 18a8 8 0 1 0 .01 0 M8 54c0-11 8-18 18-18s18 7 18 18 M40 38l6 6 12-13"/></g>
      <text x="150" y="206" text-anchor="middle" class="h" font-size="30" fill="#eef2f7">A person approves</text>
      <text x="150" y="238" text-anchor="middle" font-size="20" fill="#9aa6b6">For anything risky</text>
    </g>
  </g>

  <!-- Scene C: what to do next -->
  <g id="sceneC">
    <text x="640" y="548" text-anchor="middle" class="h" font-size="36" fill="#4fd1c5">Try the quick check below</text>
    <path id="arrow" d="M640 562 v20 M626 572 l14 14 14-14" stroke="#4fd1c5" stroke-width="5"/>
  </g>
</svg>

<div class="cap" id="cap"></div>
<div class="bar" id="bar"></div>

<script>
  const $ = (id) => document.getElementById(id)
  const clamp = (x) => Math.max(0, Math.min(1, x))
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3)
  const prog = (t, a, b) => clamp((t - a) / (b - a))
  const draw1 = (el, p) => { el.setAttribute('stroke-dasharray', '1 1'); el.setAttribute('stroke-dashoffset', String(1 - clamp(p))) }
  let TL = null
  const flowPaths = {}

  window.setup = (tl) => {
    TL = tl
    for (const k of ['pDoc', 'pMail', 'pWeb']) flowPaths[k] = { a: $(k), b: $('pMerge') }
    const dots = $('dots')
    const mk = (k, i) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
      c.setAttribute('r', '7'); c.dataset.src = k; c.dataset.i = i
      dots.appendChild(c)
    }
    for (const k of ['pDoc', 'pMail', 'pWeb']) for (let i = 0; i < 4; i++) mk(k, i)
  }

  // A point part-way along a source path, then along the merged line.
  function along(k, p) {
    const { a, b } = flowPaths[k]
    const la = a.getTotalLength(), lb = b.getTotalLength(), d = p * (la + lb)
    return d <= la ? a.getPointAtLength(d) : b.getPointAtLength(d - la)
  }

  window.draw = (t) => {
    const L = TL.lines
    const at = (i) => L[i].s
    const end = (i) => L[i].e

    // Scene A: build up, then flow
    const A = 1 - ease(prog(t, at(4) - 0.1, at(4) + 0.5))
    $('sceneA').setAttribute('opacity', A)
    draw1($('srcDoc').firstElementChild, prog(t, 0.2, 1.0))
    draw1($('srcMail').firstElementChild, prog(t, 0.35, 1.15))
    draw1($('srcWeb').firstElementChild, prog(t, 0.5, 1.3))
    for (const [id, a] of [['lblDoc', 0.7], ['lblMail', 0.85], ['lblWeb', 1.0]]) $(id).setAttribute('opacity', ease(prog(t, a, a + 0.5)))
    draw1($('pDoc'), prog(t, 1.2, 2.0)); draw1($('pMail'), prog(t, 1.3, 2.1)); draw1($('pWeb'), prog(t, 1.4, 2.2))
    draw1($('pMerge'), prog(t, 1.9, 2.5))
    $('lblStream').setAttribute('opacity', ease(prog(t, 2.6, 3.2)))
    draw1($('mBox'), prog(t, 1.6, 2.6)); draw1($('mPins'), prog(t, 2.0, 2.8)); draw1($('mNet'), prog(t, 2.3, 3.0))
    $('lblModel').setAttribute('opacity', ease(prog(t, 2.6, 3.2)))

    // The email turns pink when the line about it starts; the model reacts when the attack is named.
    const emailOn = ease(prog(t, at(2), at(2) + 0.5))
    const alert = ease(prog(t, at(3), at(3) + 0.5))
    const pink = '#f2879c'
    $('srcMail').setAttribute('stroke', emailOn > 0.5 ? pink : '#9aa6b6')
    $('lblMail').setAttribute('fill', emailOn > 0.5 ? pink : '#9aa6b6')
    $('pMail').setAttribute('stroke', emailOn > 0.5 ? pink : '#9aa6b6')
    $('bubble').setAttribute('opacity', emailOn)
    $('bubble').setAttribute('transform', `translate(0 ${(1 - emailOn) * 14})`)
    $('mBox').setAttribute('stroke', alert > 0.5 ? pink : '#a78bfa')
    $('mPins').setAttribute('stroke', alert > 0.5 ? pink : '#a78bfa')
    $('qmark').setAttribute('opacity', alert)
    $('qmark').setAttribute('transform', `translate(1135 215) scale(${0.4 + 0.6 * alert})`)

    // Flowing dots, same size and speed for every source
    const flow = ease(prog(t, 2.8, 3.4))
    const colors = { pDoc: '#4fd1c5', pMail: emailOn > 0.5 ? pink : '#9aa6b6', pWeb: '#9aa6b6' }
    for (const c of $('dots').children) {
      const k = c.dataset.src, i = Number(c.dataset.i)
      const p = ((t * 0.28) + i / 4 + (k === 'pMail' ? 0.1 : k === 'pWeb' ? 0.2 : 0)) % 1
      const pt = along(k, p)
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y)
      c.setAttribute('fill', colors[k])
      c.setAttribute('opacity', flow * (p > 0.96 ? 0 : 1))
    }

    // Scene B: three cards, one per line
    const B = ease(prog(t, at(4) + 0.1, at(4) + 0.7))
    const Bc = 1 - 0.78 * ease(prog(t, at(8), at(8) + 0.5))
    $('sceneB').setAttribute('opacity', B * Bc)
    $('fixTitle').setAttribute('opacity', ease(prog(t, at(4) + 0.2, at(4) + 0.8)))
    ;[['card1', 'g1', 5], ['card2', 'g2', 6], ['card3', 'g3', 7]].forEach(([card, g, i]) => {
      const a = ease(prog(t, at(i) - 0.15, at(i) + 0.4))
      const base = card === 'card1' ? 150 : card === 'card2' ? 490 : 830
      $(card).setAttribute('opacity', a)
      $(card).setAttribute('transform', `translate(${base} ${230 + (1 - a) * 30})`)
      draw1($(g), prog(t, at(i), at(i) + 0.9))
    })

    // The "better prompt" idea, drawn and crossed out, then cleared for the real fixes
    const old = ease(prog(t, at(4) + 0.5, at(4) + 1.0)) * (1 - ease(prog(t, at(5) - 0.45, at(5) - 0.05)))
    $('oldFix').setAttribute('opacity', old)
    draw1($('strike'), prog(t, at(4) + 2.3, at(4) + 2.9))
    $('oldBox').setAttribute('stroke', t > at(4) + 2.5 ? '#f2879c' : '#253041')

    // Scene C: point at the quick check
    const C = ease(prog(t, at(8), at(8) + 0.5))
    $('sceneC').setAttribute('opacity', C)
    $('arrow').setAttribute('transform', `translate(0 ${Math.sin(t * 5) * 6})`)

    // Caption and progress
    let cap = ''
    for (const l of L) if (t >= l.s - 0.05 && t <= l.e + 0.2) cap = l.caption
    $('cap').textContent = cap
    $('bar').style.width = `${(t / TL.total) * 100}%`
  }
</script>
</body>
</html>
